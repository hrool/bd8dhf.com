name: Deploy to Aliyun ECS via SSH and AWS S3
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Install ossutil 2.0
        run: |
          curl -o ossutil-2.3.0-linux-amd64.zip https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          unzip -q ossutil-2.3.0-linux-amd64.zip
          sudo mv ossutil-2.3.0-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version

      - name: Authenticate to Alibaba Cloud
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: 'acs:ram::1632903580111839:role/github-actions'
          oidc-provider-arn: 'acs:ram::1632903580111839:oidc-provider/GitHubOIDC'
          audience: 'github-actions'
          role-session-name: 'github-action-session'
          role-session-expiration: 1800

      - name: Sync files to Aliyun OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ env.ALIBABACLOUD_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ env.ALIBABACLOUD_ACCESS_KEY_SECRET }}
          OSS_SESSION_TOKEN: ${{ env.ALIBABACLOUD_SECURITY_TOKEN }}
          OSS_REGION: cn-hongkong
        run: |
          echo "Syncing to Aliyun OSS Bucket A..."
          ossutil sync public/ oss://bd8dhf/ --force

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-east-1  

      - name: Sync files to S3
        run: |
          aws s3 sync public/ s3://bd8dhf-com/ --delete 
          aws cloudfront create-invalidation --distribution-id E3CLYY8YVHNJQ4 --paths "/*"
